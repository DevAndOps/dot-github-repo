# VULNERABLE WORKFLOW — Demonstrates issues CodeQL WILL catch
name: codeql-catchable

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # VULNERABILITY 1: pull_request_target + checkout (Untrusted Code Execution)
  # CWE-829 - CRITICAL
  # CodeQL WILL catch this
  # ============================================================================
  dangerous-checkout:
    name: dangerous-checkout
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write  # ⚠️ Attacker can write to repo
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run untrusted code
        run: ./scripts/build.sh

  # ============================================================================
  # VULNERABILITY 2: Secrets in Environment Variables
  # CWE-312 - HIGH
  # CodeQL WILL catch this
  # ============================================================================
  secrets-exposure:
    name: secrets-exposure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Echo PR title (contains secret)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: 'echo "Processing: $PR_TITLE"'

  # ============================================================================
  # VULNERABILITY 3: Code Injection via Action Input
  # CWE-094 - CRITICAL
  # CodeQL WILL catch this
  # ============================================================================
  code-injection-action-input:
    name: code-injection-action-input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: some-action/run@v1
        with:
          command: ${{ github.event.issue.title }}

  # ============================================================================
  # VULNERABILITY 4: Excessive Secrets Exposure
  # CWE-312 - HIGH
  # CodeQL WILL catch this
  # ============================================================================
  excessive-secrets:
    name: excessive-secrets
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Do something
        run: echo "Secrets accessible here"
      - uses: untrusted-org/untrusted-action@v1

  # ============================================================================
  # VULNERABILITY 5: Missing Explicit Permissions
  # CWE-275 - HIGH
  # CodeQL WILL catch this
  # ============================================================================
  missing-permissions:
    name: missing-permissions
    runs-on: ubuntu-latest
    # ⚠️ No permissions block — defaults to full access
    steps:
      - uses: actions/checkout@v4
      - run: echo "Has full token permissions by default"

  # ============================================================================
  # VULNERABILITY 6: Untrusted Checkout - TOCTOU
  # CWE-367 - MEDIUM
  # CodeQL WILL catch this
  # ============================================================================
  toctou-vulnerability:
    name: toctou-vulnerability
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        # ⚠️ Missing explicit ref — defaults to merge commit (race condition)
      - name: Analyze code
        run: terraform plan

  # ============================================================================
  # VULNERABILITY 7: Artifact Poisoning
  # CWE-829 - HIGH
  # CodeQL WILL catch this
  # ============================================================================
  artifact-poisoning:
    name: artifact-poisoning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: ${{ github.event.pull_request.title }}
      - run: source ./downloaded-script.sh

  # ============================================================================
  # VULNERABILITY 8: Cache Poisoning
  # CWE-349 - HIGH
  # CodeQL WILL catch this
  # ============================================================================
  cache-poisoning:
    name: cache-poisoning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: ./build
          key: ${{ github.event.pull_request.title }}-cache

  # ============================================================================
  # VULNERABILITY 9: Known Vulnerable Action
  # CWE-1395 - HIGH
  # CodeQL WILL catch this
  # ============================================================================
  vulnerable-action:
    name: vulnerable-action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v2  # ⚠️ Outdated version with CVEs
        with:
          node-version: '16'
      - run: npm install

  # ============================================================================
  # VULNERABILITY 10: Unmasked Secrets in Logs
  # CWE-312 - HIGH
  # CodeQL WILL catch this
  # ============================================================================
  unmasked-secrets:
    name: unmasked-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print secret (unmasked)
        env:
          SECRET: ${{ secrets.API_KEY }}
        run: echo "My secret is: $SECRET"

  # ============================================================================
  # VULNERABILITY 11: Environment Variable Injection
  # CWE-077, CWE-020 - HIGH
  # CodeQL WILL catch this
  # ============================================================================
  env-var-injection:
    name: env-var-injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject via env
        env:
          USER_COMMAND: ${{ github.event.pull_request.body }}
        run: eval "$USER_COMMAND"

  # ============================================================================
  # SAFE EXAMPLE: Properly Secured
  # CodeQL should NOT flag this
  # ============================================================================
  safe-workflow:
    name: safe-workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci && npm run build
